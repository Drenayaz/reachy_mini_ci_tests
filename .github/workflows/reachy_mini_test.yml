name: Reachy Mini Integration Test

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/**"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  linux_wireless:
    runs-on: ci-runner-linux
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Create virtual environment
        run: python3 -m venv .venv

      - name: Install dependencies
        run: |
          source .venv/bin/activate
          python3 -m pip install --upgrade pip
          pip install reachy-mini

      - name: Start Reachy Mini Wireless daemon
        run: |
          echo "Starting Reachy Mini Wireless daemon..."
          curl -X POST "http://reachy-mini-ci.local:8000/api/daemon/start?wake_up=true" || echo "Daemon may already be running"

      - name: Wait for Wireless daemon to be running
        run: |
          echo "Waiting for Wireless daemon to start..."
          for i in {1..20}; do
            STATUS=$(curl -s http://reachy-mini-ci.local:8000/api/daemon/status | grep -o '"state":"[^"]*"' | cut -d'"' -f4)
            echo "Attempt $i: Daemon status is '$STATUS'"
            if [ "$STATUS" = "running" ]; then
              echo "[OK] Wireless daemon is now running!"
              exit 0
            fi
            sleep 3
          done
          echo "[ERROR] Wireless daemon failed to start after 60 seconds"
          exit 1

      - name: Run Reachy Mini Wireless tests
        run: |
          source .venv/bin/activate
          python3 test_reachy_mini_wireless.py

      - name: Stop Reachy Mini Wireless daemon
        if: always()
        run: |
          echo "Stopping Wireless daemon..."
          curl -X POST "http://reachy-mini-ci.local:8000/api/daemon/stop?goto_sleep=true" || echo "Failed to stop daemon"

      - name: Cleanup virtual environment
        if: always()
        run: rm -rf .venv

  linux_lite:
    needs: linux_wireless
    runs-on: ci-runner-linux
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Create virtual environment
        run: python3 -m venv .venv

      - name: Install dependencies
        run: |
          source .venv/bin/activate
          python3 -m pip install --upgrade pip
          pip install reachy-mini

      - name: Start Reachy Mini Lite daemon
        run: |
          echo "Starting Reachy Mini Lite daemon..."
          source .venv/bin/activate
          reachy-mini-daemon --robot-name reachy_mini_lite --serialport auto --localhost-only &
          echo $! > lite_daemon.pid
          echo "Daemon PID: $(cat lite_daemon.pid)"

      - name: Wait for Lite daemon to be running
        run: |
          echo "Waiting for Lite daemon to start..."
          for i in {1..20}; do
            STATUS=$(curl -s http://localhost:8000/api/daemon/status | grep -o '"state":"[^"]*"' | cut -d'"' -f4)
            echo "Attempt $i: Daemon status is '$STATUS'"
            if [ "$STATUS" = "running" ]; then
              echo "[OK] Lite daemon is now running!"
              exit 0
            fi
            sleep 3
          done
          echo "[ERROR] Lite daemon failed to start after 60 seconds"
          exit 1

      - name: Run Reachy Mini Lite tests
        run: |
          source .venv/bin/activate
          python3 test_reachy_mini_lite.py

      - name: Stop Reachy Mini Lite daemon
        if: always()
        run: |
          echo "Stopping Lite daemon..."
          curl -X POST "http://localhost:8000/api/daemon/stop?goto_sleep=true" || echo "Failed to stop daemon via API"
          sleep 2
          if [ -f lite_daemon.pid ]; then
            kill $(cat lite_daemon.pid) 2>/dev/null || echo "Daemon already stopped"
            rm lite_daemon.pid
          fi

      - name: Cleanup virtual environment
        if: always()
        run: rm -rf .venv

  windows_lite:
    runs-on: ci-runner-windows
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Create virtual environment
        shell: powershell
        run: python -m venv .venv

      - name: Install dependencies
        shell: powershell
        run: |
          .venv\Scripts\Activate.ps1
          python -m pip install --upgrade pip
          pip install reachy-mini

      - name: Start Reachy Mini Lite daemon
        shell: powershell
        run: |
          Write-Host "Starting Reachy Mini Lite daemon..."
          .venv\Scripts\Activate.ps1
          $job = Start-Job -ScriptBlock {
            Set-Location $using:PWD
            & ".venv\Scripts\reachy-mini-daemon.exe" --robot-name reachy_mini_lite --serialport auto --localhost-only
          }
          Start-Sleep -Seconds 3
          $jobState = $job.State
          Write-Host "Job state after 3 seconds: $jobState"
          if ($jobState -eq "Failed" -or $jobState -eq "Stopped") {
            Write-Host "[ERROR] Job failed to start. Output:"
            Receive-Job -Job $job
            exit 1
          }

      - name: Wait for Lite daemon to be running
        shell: powershell
        run: |
          Write-Host "Waiting for Lite daemon to start..."
          for ($i = 1; $i -le 20; $i++) {
            # Check if job is still running
            $job = Get-Job | Where-Object { $_.State -eq "Running" } | Select-Object -First 1
            if (-not $job) {
              Write-Host "[ERROR] Daemon job is not running anymore. Job output:"
              Get-Job | Receive-Job
              exit 1
            }

            try {
              $response = Invoke-RestMethod -Uri "http://localhost:8000/api/daemon/status" -Method Get
              $status = $response.state
              Write-Host "Attempt $i : Daemon status is '$status'"
              if ($status -eq "running") {
                Write-Host "[OK] Lite daemon is now running!"
                exit 0
              }
            } catch {
              Write-Host "Attempt $i : Failed to get status"
            }
            Start-Sleep -Seconds 3
          }
          Write-Host "[ERROR] Lite daemon failed to start after 60 seconds"
          Write-Host "Job output:"
          Get-Job | Receive-Job
          exit 1

      - name: Run Reachy Mini Lite tests
        shell: powershell
        run: |
          .venv\Scripts\Activate.ps1
          python test_reachy_mini_lite.py

      - name: Stop Reachy Mini Lite daemon
        if: always()
        shell: powershell
        run: |
          Write-Host "Stopping Lite daemon..."
          curl.exe -X POST "http://localhost:8000/api/daemon/stop?goto_sleep=true"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Failed to stop daemon via API"
          }
          Start-Sleep -Seconds 2
          Get-Job | Stop-Job -ErrorAction SilentlyContinue
          Get-Job | Remove-Job -ErrorAction SilentlyContinue

      - name: Cleanup virtual environment
        if: always()
        shell: powershell
        run: Remove-Item -Recurse -Force .venv -ErrorAction SilentlyContinue

  windows_wireless:
    needs: [linux_wireless, windows_lite]
    runs-on: ci-runner-windows
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Create virtual environment
        shell: powershell
        run: python -m venv .venv

      - name: Install dependencies
        shell: powershell
        run: |
          .venv\Scripts\Activate.ps1
          python -m pip install --upgrade pip
          pip install reachy-mini

      - name: Start Reachy Mini Wireless daemon
        shell: powershell
        run: |
          Write-Host "Starting Reachy Mini Wireless daemon..."
          curl.exe -X POST "http://reachy-mini-ci.local:8000/api/daemon/start?wake_up=true"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Daemon may already be running"
          }

      - name: Wait for Wireless daemon to be running
        shell: powershell
        run: |
          Write-Host "Waiting for Wireless daemon to start..."
          for ($i = 1; $i -le 20; $i++) {
            try {
              $response = Invoke-RestMethod -Uri "http://reachy-mini-ci.local:8000/api/daemon/status" -Method Get
              $status = $response.state
              Write-Host "Attempt $i : Daemon status is '$status'"
              if ($status -eq "running") {
                Write-Host "[OK] Wireless daemon is now running!"
                exit 0
              }
            } catch {
              Write-Host "Attempt $i : Failed to get status"
            }
            Start-Sleep -Seconds 3
          }
          Write-Host "[ERROR] Wireless daemon failed to start after 60 seconds"
          exit 1

      - name: Run Reachy Mini Wireless tests
        shell: powershell
        run: |
          .venv\Scripts\Activate.ps1
          python test_reachy_mini_wireless.py

      - name: Stop Reachy Mini Wireless daemon
        if: always()
        shell: powershell
        run: |
          Write-Host "Stopping Wireless daemon..."
          curl.exe -X POST "http://reachy-mini-ci.local:8000/api/daemon/stop?goto_sleep=true"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Failed to stop daemon"
          }

      - name: Cleanup virtual environment
        if: always()
        shell: powershell
        run: Remove-Item -Recurse -Force .venv -ErrorAction SilentlyContinue
